x-app: &app
  image: apex-referral-service:${APP_VERSION:-0.1.0}
  init: true
  environment: &app-environment
    APP_ENV: ${DOCKER_APP_ENV:-production}
    APP_VERSION: ${APP_VERSION:-0.1.0}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in .env}
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
    OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-2}
    OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
    WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-2}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    OUTBOX_CLAIM_LEASE_SECONDS: ${OUTBOX_CLAIM_LEASE_SECONDS:-300}
    RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
    RETRY_BACKOFF_BASE_MS: ${RETRY_BACKOFF_BASE_MS:-500}
    IDEMPOTENCY_TTL_HOURS: ${IDEMPOTENCY_TTL_HOURS:-24}
    REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
    RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    RATE_LIMIT_BACKEND_TIMEOUT_SECONDS: ${RATE_LIMIT_BACKEND_TIMEOUT_SECONDS:-0.25}
    RATE_LIMIT_REFERRAL_PER_MINUTE: ${RATE_LIMIT_REFERRAL_PER_MINUTE:-30}
    RATE_LIMIT_REFERRAL_BURST: ${RATE_LIMIT_REFERRAL_BURST:-10}
    RATE_LIMIT_STATUS_PER_MINUTE: ${RATE_LIMIT_STATUS_PER_MINUTE:-120}
    RATE_LIMIT_STATUS_BURST: ${RATE_LIMIT_STATUS_BURST:-30}
    RATE_LIMIT_REPLAY_PER_MINUTE: ${RATE_LIMIT_REPLAY_PER_MINUTE:-5}
    RATE_LIMIT_REPLAY_BURST: ${RATE_LIMIT_REPLAY_BURST:-2}
    RATE_LIMIT_AUTH_FAILURE_PER_MINUTE: ${RATE_LIMIT_AUTH_FAILURE_PER_MINUTE:-10}
    RATE_LIMIT_AUTH_FAILURE_BURST: ${RATE_LIMIT_AUTH_FAILURE_BURST:-10}
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 30s

services:
  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    user: "999:1000"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-apex_referrals}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()",
        ]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    <<: *app
    command: ["python", "-m", "src.worker_main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
